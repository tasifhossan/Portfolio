<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="munibg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#munibg)"/>
  <circle cx="680" cy="120" r="150" fill="#10b981" opacity="0.1"/>

  <!-- UI Window Mockup -->
  <rect x="60" y="60" width="680" height="380" rx="12" fill="#061a14" stroke="#047857" stroke-width="1.5"/>
  <rect x="60" y="60" width="680" height="42" rx="12" fill="#064e3b"/>
  <circle cx="90" cy="81" r="5" fill="#ef4444"/>
  <circle cx="108" cy="81" r="5" fill="#f59e0b"/>
  <circle cx="126" cy="81" r="5" fill="#10b981"/>
  <text x="160" y="86" fill="#a7f3d0" font-family="sans-serif" font-size="12">MuniFix Ctg — Civic Complaint &amp; Infrastructure Portal</text>

  <!-- Left: Ticket Details -->
  <rect x="80" y="120" width="340" height="290" rx="8" fill="#042f2e" stroke="#065f46" stroke-width="1"/>
  <rect x="100" y="140" width="120" height="24" rx="4" fill="#065f46"/>
  <text x="110" y="156" fill="#6ee7b7" font-family="sans-serif" font-size="11" font-weight="bold">#CTG-2026-8492</text>
  <text x="100" y="190" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Pothole Hazard at Agrabad C/A</text>
  <text x="100" y="215" fill="#a7f3d0" font-family="sans-serif" font-size="12">Ward 27 | Assigned to: Engineering Dept</text>

  <!-- Status Steps -->
  <circle cx="110" cy="255" r="8" fill="#10b981"/>
  <text x="130" y="260" fill="#ffffff" font-family="sans-serif" font-size="12">Reported by Citizen</text>
  <line x1="110" y1="265" x2="110" y2="285" stroke="#10b981" stroke-width="2"/>
  
  <circle cx="110" cy="295" r="8" fill="#10b981"/>
  <text x="130" y="300" fill="#ffffff" font-family="sans-serif" font-size="12">Ward Verified &amp; Geocoded</text>
  <line x1="110" y1="305" x2="110" y2="325" stroke="#10b981" stroke-width="2"/>

  <circle cx="110" cy="335" r="8" fill="#f59e0b"/>
  <text x="130" y="340" fill="#fef08a" font-family="sans-serif" font-size="12">Repair Crew Dispatched</text>
  <line x1="110" y1="345" x2="110" y2="365" stroke="#334155" stroke-width="2"/>

  <circle cx="110" cy="375" r="8" fill="#334155"/>
  <text x="130" y="380" fill="#64748b" font-family="sans-serif" font-size="12">Resolved &amp; Closed</text>

  <!-- Right: Metrics Map Card -->
  <rect x="440" y="120" width="280" height="135" rx="8" fill="#042f2e" stroke="#065f46" stroke-width="1"/>
  <text x="460" y="150" fill="#a7f3d0" font-family="sans-serif" font-size="12">TICKETS RESOLVED</text>
  <text x="460" y="195" fill="#ffffff" font-family="sans-serif" font-size="32" font-weight="bold">850+</text>
  <text x="460" y="225" fill="#34d399" font-family="sans-serif" font-size="12">Over 41 Municipal Wards</text>

  <rect x="440" y="275" width="280" height="135" rx="8" fill="#042f2e" stroke="#065f46" stroke-width="1"/>
  <text x="460" y="305" fill="#a7f3d0" font-family="sans-serif" font-size="12">AVG RESOLUTION TIME</text>
  <text x="460" y="350" fill="#38bdf8" font-family="sans-serif" font-size="32" font-weight="bold">3.2 Days</text>
  <text x="460" y="380" fill="#94a3b8" font-family="sans-serif" font-size="12">Down from 18+ days baseline</text>

  <text x="70" y="475" fill="#64748b" font-family="sans-serif" font-size="13">MuniFix Ctg — AI-Powered Civic Complaint Platform</text>
</svg>
