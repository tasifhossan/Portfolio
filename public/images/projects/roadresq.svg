<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="roadbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="blue-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#roadbg)"/>
  <circle cx="720" cy="100" r="140" fill="#38bdf8" opacity="0.12"/>

  <!-- Phone / Dispatch Mockup -->
  <rect x="60" y="60" width="680" height="380" rx="12" fill="#0b1329" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="60" y="60" width="680" height="42" rx="12" fill="#1e3a8a"/>
  <circle cx="90" cy="81" r="5" fill="#ef4444"/>
  <circle cx="108" cy="81" r="5" fill="#f59e0b"/>
  <circle cx="126" cy="81" r="5" fill="#10b981"/>
  <text x="160" y="86" fill="#bfdbfe" font-family="sans-serif" font-size="12">RoadResQ — Emergency Breakdown &amp; Dispatch Fleet</text>

  <!-- Left: Live Dispatch Radar -->
  <rect x="80" y="120" width="340" height="290" rx="8" fill="#172554" stroke="#1e40af" stroke-width="1"/>
  <circle cx="250" cy="240" r="90" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,4"/>
  <circle cx="250" cy="240" r="60" fill="none" stroke="#60a5fa" stroke-width="1"/>
  <circle cx="250" cy="240" r="30" fill="none" stroke="#93c5fd" stroke-width="1"/>
  <!-- User Pin -->
  <circle cx="250" cy="240" r="6" fill="#ef4444"/>
  <!-- Nearby Mechanic Pins -->
  <circle cx="220" cy="200" r="5" fill="#34d399"/>
  <circle cx="290" cy="260" r="5" fill="#34d399"/>
  <circle cx="210" cy="280" r="5" fill="#34d399"/>
  <rect x="100" y="360" width="300" height="32" rx="6" fill="url(#blue-glow)"/>
  <text x="160" y="381" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">DISPATCHING MECHANIC (ETA 8 MIN)</text>

  <!-- Right: Metrics -->
  <rect x="440" y="120" width="280" height="135" rx="8" fill="#172554" stroke="#1e40af" stroke-width="1"/>
  <text x="460" y="150" fill="#93c5fd" font-family="sans-serif" font-size="12">DISPATCH MATCH SPEED</text>
  <text x="460" y="195" fill="#ffffff" font-family="sans-serif" font-size="32" font-weight="bold">&lt; 90 sec</text>
  <text x="460" y="225" fill="#34d399" font-family="sans-serif" font-size="12">15km Radius Geospatial Search</text>

  <rect x="440" y="275" width="280" height="135" rx="8" fill="#172554" stroke="#1e40af" stroke-width="1"/>
  <text x="460" y="305" fill="#93c5fd" font-family="sans-serif" font-size="12">MOBILE BUNDLE WEIGHT</text>
  <text x="460" y="350" fill="#38bdf8" font-family="sans-serif" font-size="32" font-weight="bold">176 KB</text>
  <text x="460" y="380" fill="#94a3b8" font-family="sans-serif" font-size="12">Optimized for low-bandwidth 3G coverage</text>

  <text x="70" y="475" fill="#64748b" font-family="sans-serif" font-size="13">RoadResQ — On-Demand Roadside Assistance &amp; Fleet Logistics</text>
</svg>
