<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="fixbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="50%" stop-color="#0c0a09"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#fixbg)"/>
  <circle cx="680" cy="140" r="160" fill="#f59e0b" opacity="0.1"/>

  <!-- Code / Terminal Window -->
  <rect x="60" y="60" width="680" height="380" rx="12" fill="#09090b" stroke="#27272a" stroke-width="2"/>
  <rect x="60" y="60" width="680" height="42" rx="12" fill="#18181b"/>
  <circle cx="90" cy="81" r="5" fill="#ef4444"/>
  <circle cx="108" cy="81" r="5" fill="#f59e0b"/>
  <circle cx="126" cy="81" r="5" fill="#10b981"/>
  <text x="160" y="86" fill="#a1a1aa" font-family="monospace" font-size="12">POST /api/v1/dispatch/lock-technician — 200 OK (38ms)</text>

  <!-- Left: API JSON Payload -->
  <rect x="80" y="120" width="310" height="290" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="100" y="150" fill="#f59e0b" font-family="monospace" font-size="12">// Atomic Provider Dispatch</text>
  <text x="100" y="180" fill="#38bdf8" font-family="monospace" font-size="12">POST /bookings/create</text>
  <text x="100" y="210" fill="#71717a" font-family="monospace" font-size="12">{</text>
  <text x="115" y="235" fill="#e4e4e7" font-family="monospace" font-size="12">  "serviceId": "plumbing_01",</text>
  <text x="115" y="260" fill="#e4e4e7" font-family="monospace" font-size="12">  "radiusKm": 8.5,</text>
  <text x="115" y="285" fill="#e4e4e7" font-family="monospace" font-size="12">  "lockTimeoutSec": 60,</text>
  <text x="115" y="310" fill="#4ade80" font-family="monospace" font-size="12">  "status": "ATOMIC_LOCKED"</text>
  <text x="100" y="335" fill="#71717a" font-family="monospace" font-size="12">}</text>
  <rect x="100" y="360" width="140" height="24" rx="4" fill="url(#amber-glow)"/>
  <text x="120" y="377" fill="#18181b" font-family="monospace" font-size="11" font-weight="bold">EXECUTE TX</text>

  <!-- Right: Architecture Metrics -->
  <rect x="410" y="120" width="310" height="135" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="430" y="150" fill="#a1a1aa" font-family="sans-serif" font-size="12">CONCURRENCY BENCHMARK</text>
  <text x="430" y="190" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="bold">0 Collisions</text>
  <text x="430" y="225" fill="#10b981" font-family="sans-serif" font-size="12">500 Concurrent Simulated Checkouts</text>

  <rect x="410" y="275" width="310" height="135" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="430" y="305" fill="#a1a1aa" font-family="sans-serif" font-size="12">TRANSACTION LATENCY</text>
  <text x="430" y="345" fill="#f59e0b" font-family="sans-serif" font-size="28" font-weight="bold">p99: 58ms</text>
  <text x="430" y="380" fill="#94a3b8" font-family="sans-serif" font-size="12">PostgreSQL ACID Transaction Isolation</text>

  <text x="70" y="475" fill="#71717a" font-family="sans-serif" font-size="13">Fix It Now — High-Concurrency Home Services Marketplace Engine</text>
</svg>
